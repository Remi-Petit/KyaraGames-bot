name: Release

# Déclenché uniquement par un tag de version (v0.1.0, v1.2.3, ...).
on:
  push:
    tags:
      - 'v*'

# Créer une release demande contents: write sur le dépôt.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          echo "package.json: $version / tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json ($version) ne correspond pas au tag ($tag)"
            exit 1
          fi

      - name: Installer
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compiler
        run: npm run build

      # Toujours publiée : ni --draft ni --prerelease.
      # --latest la marque comme release courante du dépôt.
      # Idempotent : un rejeu sur le même tag ne casse pas le job.
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release déjà publiée pour $GITHUB_REF_NAME"
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --latest
          fi

  # Image Docker publiée sur GitHub Container Registry :
  #   ghcr.io/<owner>/<repo>:<tag>  et  ghcr.io/<owner>/<repo>:latest
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Étapes séparées : si ça casse, l'onglet Actions nomme la coupable
      # (login = droits, build = Dockerfile, push = permissions du package).
      - name: Connexion à GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Construire l'image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_ENV"
          docker build -t "$image:$GITHUB_REF_NAME" -t "$image:latest" .

      - name: Publier l'image
        run: |
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
          {
            echo "### Image publiée"
            echo ""
            echo '```'
            echo "$image:$GITHUB_REF_NAME"
            echo "$image:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

